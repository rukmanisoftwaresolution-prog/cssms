spring.application.name=cssms
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/cssms}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIMEZONE:Asia/Kolkata}
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=1000
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.jackson.serialization.write-dates-as-timestamps=false
server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
app.security.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-0123456789}
app.security.access-token-minutes=${JWT_ACCESS_MINUTES:30}
app.security.refresh-token-days=${JWT_REFRESH_DAYS:7}
app.security.reset-token-minutes=30
app.security.expose-reset-token=${EXPOSE_RESET_TOKEN:false}
app.security.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@123}
app.admin.email=${APP_ADMIN_EMAIL:admin@cssms.local}
app.storage.upload-dir=${UPLOAD_DIR:./uploads}
app.company.name=${COMPANY_NAME:CSSMS Crusher & Stone Supply}
app.company.address=${COMPANY_ADDRESS:Crusher Road, Industrial Area}
app.company.phone=${COMPANY_PHONE:+91 00000 00000}
app.company.gstin=${COMPANY_GSTIN:}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
logging.level.root=INFO
logging.level.com.cssms=${APP_LOG_LEVEL:INFO}